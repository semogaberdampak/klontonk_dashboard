# Jalankan:  podman compose up -d      Hentikan:  podman compose down
# Dashboard disajikan di http://localhost:8081 (aplikasi POS memakai 8080, jadi keduanya bisa jalan bersama).
services:
  dashboard:
    image: public.ecr.aws/nginx/nginx:alpine
    container_name: klontonk-dashboard
    restart: always
    ports:
      # Hanya bisa diakses dari komputer ini.
      - "127.0.0.1:8081:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro