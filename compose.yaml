# Jalankan:  podman compose up -d --build      Hentikan:  podman compose down
# Dashboard dibangun DI DALAM Podman (lihat Containerfile) dan disajikan di http://localhost:8081
# (aplikasi POS memakai 8080, jadi keduanya bisa jalan bersama).
#
# DEMO_MODE: "true"  = data contoh tanpa Supabase dan tanpa login;
#            "false" = terhubung ke Supabase (butuh skema dari db/dashboard-schema.sql).
services:
  dashboard:
    build:
      context: .
      dockerfile: Containerfile
      args:
        DEMO_MODE: "true"
    image: klontonk-dashboard:latest
    container_name: klontonk-dashboard
    restart: always
    ports:
      # Hanya bisa diakses dari komputer ini.
      - "127.0.0.1:8081:80"
