# Penyaji berkas statis Klontonk Dashboard (hasil `npm run build` di folder dist/).
# Tidak ada backend: seluruh data dan login ada di Supabase, diakses langsung dari browser.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Selalu tanya server (304 bila tidak berubah), agar tidak memakai cache basi.
  add_header Cache-Control "no-cache" always;

  # Jangan sajikan berkas tersembunyi (.git, .env).
  location ~ /\. { return 404; }

  # Berkas hasil build di assets/ bernama dengan hash isi -> aman di-cache lama.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ =404; }
}
