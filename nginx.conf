# Penyaji berkas statis Klontonk Dashboard (hasil `flutter build web` di build/web/).
# Tidak ada backend: seluruh data dan login ada di Supabase, diakses langsung dari browser.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Selalu tanya server (304 bila tidak berubah), agar tidak memakai cache basi.
  add_header Cache-Control "no-cache" always;

  # Jangan sajikan berkas tersembunyi (.git, .env).
  location ~ /\. { return 404; }

  # Aset Flutter (canvaskit, font, ikon) jarang berubah per versi.
  location /canvaskit/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # SPA: rute yang tidak punya berkas jatuh ke index.html (routing ditangani aplikasi).
  location / { try_files $uri $uri/ /index.html; }
}
